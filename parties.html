    de: { datenschutz: "Datenschutzerklärung", disclaimer: "Haftungsausschluss", grundgesetz: "Grundgesetz", about: "Über Wahlblick", directory: "Adressverzeichnis", guide: "Nutzungshinweise", holidays: "Feiertage", government: "Koalitionen" },

    en: { datenschutz: "Privacy Policy", disclaimer: "Disclaimer", grundgesetz: "Basic Law", about: "About Wahlblick", directory: "Directory", guide: "User Guide", holidays: "Holidays", government: "Coalitions" }
  };

  function render(lang) {
    document.documentElement.lang = lang;
    var c = CONTENT[lang];
    var f = FOOT[lang];
    document.title = c.title + " — Wahlblick";
    document.querySelector("[data-title]").textContent = c.title;
    document.querySelector("[data-intro]").textContent = c.intro;
    document.querySelector("[data-back]").textContent = c.backLabel;
    document.querySelector("[data-foot-back]").textContent = c.backLabel;
    document.querySelector("[data-heading]").textContent = c.heading;
    document.querySelector("[data-sub]").textContent = c.sub;
    document.querySelector("[data-foot-datenschutz]").textContent = f.datenschutz;
    document.querySelector("[data-foot-disclaimer]").textContent = f.disclaimer;
    document.querySelector("[data-foot-about]").textContent = f.about;
    document.querySelector("[data-foot-guide]").textContent = f.guide;
    document.querySelector("[data-related-heading]").textContent = c.relatedHeading;
    document.querySelector("[data-rc-seats-t]").textContent = c.relatedSeatsT;
    document.querySelector("[data-rc-seats-d]").textContent = c.relatedSeatsD;
    document.querySelector("[data-rc-gov-t]").textContent = c.relatedGovT;
    document.querySelector("[data-rc-gov-d]").textContent = c.relatedGovD;
    document.querySelector("[data-rc-map-t]").textContent = c.relatedMapT;
    document.querySelector("[data-rc-map-d]").textContent = c.relatedMapD;

    var wrap = document.querySelector("[data-parties]");
    wrap.innerHTML = "";
    c.parties.forEach(function (p) {
      var el = document.createElement("div");
      el.className = "party-row";
      var positions = p.positions.map(function (pos) { return "<li>" + pos + "</li>"; }).join("");
      var dissolvedHtml = p.dissolved ? "<p class=\"dissolved-note\">" + p.dissolved + "</p>" : "";
      var linkLabel = p.dissolved ? c.dissolvedLabel : c.sourceLabel;
      var bundestagHtml = p.bundestagUrl ? "<a class=\"source-link\" href=\"" + p.bundestagUrl + "\" target=\"_blank\" rel=\"noopener\">" + c.bundestagLabel + " ↗</a>" : "";
      el.innerHTML =
        "<span class=\"swatch\" style=\"background:" + p.color + "\"></span>" +
        "<div class=\"body\">" +
          "<h3>" + p.name + "</h3>" +
          "<p class=\"founded\">" + p.founded + "</p>" +
          "<p class=\"history\">" + p.history + "</p>" +
          dissolvedHtml +
          "<ul>" + positions + "</ul>" +
          "<div class=\"links\"><a class=\"source-link\" href=\"" + p.sourceUrl + "\" target=\"_blank\" rel=\"noopener\">" + linkLabel + " ↗</a>" + bundestagHtml + "</div>" +
        "</div>";
      wrap.appendChild(el);
    });
  }

  document.querySelectorAll(".lang-switch button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var lang = btn.getAttribute("data-lang");
      localStorage.setItem("wahlblickLang", lang);
      document.querySelectorAll(".lang-switch button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      render(lang);
    });
  });

  var initialLang = localStorage.getItem("wahlblickLang") || "de";
  if (!CONTENT[initialLang]) initialLang = "de";
  document.querySelectorAll(".lang-switch button").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-lang") === initialLang);
  });
  render(initialLang);
</script>
