<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f8f9;
    --border: #e3e6ea;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --accent: #004494;
    --accent-ink: #ffffff;
    --strip-bg: #12161c;
    --strip-text: #c7cdd6;
    --radius: 4px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }

  .official-strip {
    background: var(--strip-bg);
    color: var(--strip-text);
    font-size: 12px;
    padding: 6px 24px;
    display: flex;
    justify-content: center;
    gap: 6px;
    text-align: center;
  }

  .site-header { background: var(--bg); border-bottom: 1px solid var(--border); }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; flex: none; text-decoration: none; }
  .brand .badge {
    width: 34px; height: 34px;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px;
    flex: none;
  }
  .brand .flag-bar {
    width: 7px; height: 34px;
    border-radius: 2px;
    flex: none;
    background: linear-gradient(to bottom, #000 0% 33.33%, #dd0000 33.33% 66.66%, #ffce00 66.66% 100%);
  }
  .brand .wordmark { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; color: var(--text); white-space: nowrap; }

  .header-right { display: flex; align-items: center; gap: 16px; flex: none; }
  .back-link { font-size: 13px; font-weight: 600; text-decoration: none; color: var(--text); white-space: nowrap; }
  .back-link:hover { color: var(--accent); }

  .lang-switch { display: flex; align-items: center; gap: 2px; flex: none; }
  .lang-switch button {
    border: none; background: none; color: var(--text-muted);
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.02em;
    padding: 5px 7px; cursor: pointer; border-radius: var(--radius);
  }
  .lang-switch button:hover { color: var(--text); background: var(--surface); }
  .lang-switch button.active { color: var(--accent); }
  .lang-switch .sep { color: var(--border); font-size: 12px; }

  main { max-width: 860px; margin: 0 auto; padding: 32px 24px 56px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .intro { font-size: 14.5px; line-height: 1.65; color: var(--text-muted); margin: 0 0 28px; }

  .group-heading { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 12px; }
  .group { margin-bottom: 32px; }

  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .cat-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .cat-card h3 { font-size: 14.5px; margin: 0 0 6px; }
  .cat-card p { font-size: 13px; line-height: 1.55; margin: 0 0 10px; color: var(--text-muted); }
  .cat-card .status {
    display: inline-block;
    font-size: 11px; font-weight: 700;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
  }

  .note {
    margin-top: 8px;
    font-size: 12.5px; color: var(--text-muted); line-height: 1.6;
  }

  footer {
    max-width: 1200px; margin: 0 auto; padding: 18px 24px 40px;
    border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-muted);
  }
  footer .foot-links { display: flex; gap: 16px; flex-wrap: wrap; row-gap: 8px; }
  footer a { color: var(--text-muted); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 720px) {
    .official-strip { flex-wrap: wrap; padding: 6px 16px; font-size: 11px; }
    .header-inner { padding: 12px 16px; flex-wrap: wrap; row-gap: 8px; }
    .brand .wordmark { font-size: 16px; }
    main { padding: 24px 16px 40px; }
    .cat-grid { grid-template-columns: 1fr; }
    footer { padding: 16px 16px 32px; }
  }
</style>

<div class="official-strip">

<main>

  <p class="intro" data-intro></p>

<script>

      group1Heading: "Leben in Deutschland",
      group2Heading: "Bürgerbeteiligung und Gesellschaft",
      note: "Diese Liste ersetzt keine Rechts- oder Behördenberatung. Wahlblick prüft die aufgenommenen Stellen nach bestem Wissen, übernimmt aber keine Garantie für Vollständigkeit oder Aktualität einzelner Kontaktdaten.",
      categories: [
        { title: "Behördengänge und Anmeldung", text: "Bürgeramt (Anmeldung des Wohnsitzes) und Ausländerbehörde für Aufenthaltstitel." },
        { title: "Spanischsprachige Konsulate und Botschaften", text: "Konsularvertretungen spanischsprachiger Länder in Deutschland — für Reisepässe, Vollmachten und Dokumente." },
        { title: "Migrations- und Rechtsberatung", text: "Kostenlose oder günstige Beratungsstellen (Migrationsberatung) und NGOs, die Migrant*innen unterstützen." },
        { title: "Gesundheit und Krankenversicherung", text: "Wie die Krankenkasse funktioniert, wie man eine passende Versicherung wählt, und Gesundheits-Hotlines." },
        { title: "Arbeit und Anerkennung von Abschlüssen", text: "Agentur für Arbeit, Jobcenter und Stellen zur Anerkennung ausländischer Berufs- und Studienabschlüsse." },
        { title: "Wohnen", text: "Mietervereine sowie Informationen zu Mietverträgen und Mieterrechten." },
        { title: "Sprache und Integration", text: "Integrationskurse, kostenlose oder geförderte Deutschkurse, und Volkshochschulen (VHS)." },
        { title: "Familie und Bildung", text: "Kindergeld, Jugendamt, Schulanmeldung und Kita-Plätze." },
        { title: "Spanischsprachige Community", text: "Kulturvereine, Gemeinden und Treffpunkte für spanischsprachige Menschen." },
        { title: "Notfälle und wichtige Nummern", text: "Polizei, Feuerwehr, Rettungsdienst und Krisen-Hotlines." }
      ],
      categoriesGroup2: [
        { title: "Bürgerbeteiligung", text: "Petitionsplattformen (z. B. e-Petitionen des Bundestags) und kommunale Bürgerhaushalte." },
        { title: "Verbraucherschutz", text: "Verbraucherzentralen — nützlich für alle Einwohner*innen, nicht nur für Zugezogene." },
        { title: "Amtliche Statistikstellen", text: "Statistisches Bundesamt und die Statistischen Landesämter — für alle, die tiefer in die Daten hinter dieser Karte eintauchen möchten." },
        { title: "Ehrenamt und gesellschaftliches Engagement", text: "Freiwilligenagenturen und Organisationen für mehr direkte Demokratie (z. B. Mehr Demokratie e. V.)." },
        { title: "Bürgerbeauftragte und Beschwerdestellen", text: "Bürgerbeauftragte und Ombudsstellen für formelle Beschwerden gegen Entscheidungen der öffentlichen Verwaltung." }
      ]
    },
    es: {
      title: "Directorio de direcciones",
      backLabel: "← Volver al mapa",
      intro: "Un listado curado de puntos de contacto útiles para la vida en Alemania y la participación en lo cotidiano democrático. Las categorías ya están definidas — las direcciones concretas se están recopilando y se van a ir sumando.",
      group1Heading: "Vida en Alemania",
      group2Heading: "Participación ciudadana y sociedad",
      note: "Este listado no reemplaza el asesoramiento legal ni de una autoridad oficial. Wahlblick revisa las entidades incluidas según su mejor criterio, pero no garantiza la exactitud ni la vigencia de cada dato de contacto.",
      categories: [
        { title: "Trámites y registro", text: "Bürgeramt (registro de domicilio, Anmeldung) y Ausländerbehörde (oficina de extranjería) para permisos de residencia." },
        { title: "Consulados y embajadas hispanohablantes", text: "Sedes consulares de países de habla hispana en Alemania, para pasaportes, poderes y documentación." },
        { title: "Asesoría migratoria y legal", text: "Centros de asesoría gratuita o de bajo costo (Migrationsberatung) y ONGs de apoyo a migrantes." },
        { title: "Salud y seguro médico", text: "Cómo funciona el Krankenkasse, cómo elegir seguro, y líneas de salud." },
        { title: "Trabajo y homologación de títulos", text: "Agentur für Arbeit, Jobcenter, y organismos de reconocimiento de títulos extranjeros (Anerkennung)." },
        { title: "Vivienda", text: "Asociaciones de inquilinos (Mieterverein) y recursos sobre contratos de alquiler y derechos del inquilino." },
        { title: "Idioma e integración", text: "Integrationskurse, alemán gratuito o subsidiado, y Volkshochschulen (VHS)." },
        { title: "Familia y educación", text: "Kindergeld, Jugendamt, inscripción escolar y Kita (jardín de infantes)." },
        { title: "Comunidad hispanohablante", text: "Asociaciones culturales, iglesias, y espacios de encuentro para hispanohablantes." },
        { title: "Emergencias y números útiles", text: "Policía, bomberos, ambulancia, y líneas de ayuda en crisis." }
      ],
      categoriesGroup2: [
        { title: "Participación ciudadana", text: "Plataformas de peticiones (e-Petitionen del Bundestag) y presupuestos participativos municipales (Bürgerhaushalt)." },
        { title: "Protección al consumidor", text: "Verbraucherzentrale (oficinas de defensa del consumidor), útil para cualquier residente, no solo migrante." },
        { title: "Oficinas de estadística oficial", text: "Statistisches Bundesamt y oficinas estatales, para quien quiera profundizar en los datos detrás de este mapa." },
        { title: "Voluntariado y compromiso cívico", text: "Agencias de voluntariado (Freiwilligenagenturen) y organizaciones de democracia participativa (ej. Mehr Demokratie e. V.)." },
        { title: "Defensoría y reclamos ante la administración", text: "Bürgerbeauftragte / Ombudsstellen, para reclamos formales contra decisiones de la administración pública." }
      ]
    },
    en: {
      title: "Address directory",
      backLabel: "← Back to the map",
      intro: "A curated list of useful contact points for everyday life in Germany and participation in its democratic life. The categories are set — the actual addresses are being compiled and will be added over time.",
      group1Heading: "Life in Germany",
      group2Heading: "Civic participation and society",
      note: "This list is not a substitute for legal or official advice. Wahlblick reviews the entities it includes to the best of its ability, but does not guarantee the accuracy or currency of any individual contact detail.",
      categories: [
        { title: "Registration and administrative procedures", text: "The Bürgeramt (residence registration, \"Anmeldung\") and the Ausländerbehörde (immigration office) for residence permits." },
        { title: "Spanish-speaking consulates and embassies", text: "Consular offices of Spanish-speaking countries in Germany — for passports, powers of attorney, and official documents." },
        { title: "Migration and legal counseling", text: "Free or low-cost counseling centers (Migrationsberatung) and NGOs that support migrants." },
        { title: "Health and health insurance", text: "How the Krankenkasse (health insurance fund) system works, how to choose coverage, and health hotlines." },
        { title: "Work and recognition of qualifications", text: "The Agentur für Arbeit (employment agency), Jobcenter, and bodies that recognize foreign qualifications." },
        { title: "Housing", text: "Tenant associations (Mieterverein) and resources on rental contracts and tenant rights." },
        { title: "Language and integration", text: "Integration courses (Integrationskurse), free or subsidized German classes, and adult education centers (Volkshochschule)." },
        { title: "Family and education", text: "Child benefits (Kindergeld), the Jugendamt (youth welfare office), school enrollment, and daycare (Kita) places." },
        { title: "Spanish-speaking community", text: "Cultural associations, churches, and meeting spaces for Spanish speakers." },
        { title: "Emergencies and useful numbers", text: "Police, fire department, ambulance, and crisis helplines." }
      ],
      categoriesGroup2: [
        { title: "Civic participation", text: "Petition platforms (e.g., the Bundestag's e-Petitionen) and municipal participatory budgets (Bürgerhaushalt)." },
        { title: "Consumer protection", text: "Verbraucherzentrale (consumer protection offices) — useful for any resident, not just newcomers." },
        { title: "Official statistics offices", text: "The Federal Statistical Office (Statistisches Bundesamt) and state statistical offices — for anyone who wants to dig deeper into the data behind this map." },
        { title: "Volunteering and civic engagement", text: "Volunteer agencies (Freiwilligenagenturen) and organizations promoting direct democracy (e.g., Mehr Demokratie e.V.)." },
        { title: "Ombudsman and administrative complaints", text: "Bürgerbeauftragte (citizen ombudsman offices) for formal complaints against public administration decisions." }
      ]
    }
  };

  function render(lang) {
    var c = CONTENT[lang];
    document.title = c.title + " — Wahlblick";
    document.querySelector("[data-title]").textContent = c.title;
    document.querySelector("[data-intro]").textContent = c.intro;
    document.querySelector("[data-back]").textContent = c.backLabel;
    document.querySelector("[data-group1-heading]").textContent = c.group1Heading;
    document.querySelector("[data-group2-heading]").textContent = c.group2Heading;
    document.querySelector("[data-note]").textContent = c.note;

    var status = STATUS_LABEL[lang];

    function renderGroup(selector, list) {
      var wrap = document.querySelector(selector);
      wrap.innerHTML = "";
      list.forEach(function (cat) {
        var card = document.createElement("div");
        card.className = "cat-card";
        card.innerHTML = "<h3>" + cat.title + "</h3><p>" + cat.text + "</p><span class=\"status\">" + status + "</span>";
        wrap.appendChild(card);
      });
    }
    renderGroup("[data-group1]", c.categories);
    renderGroup("[data-group2]", c.categoriesGroup2);
  }

  var LANG_STORAGE_KEY = "wahlblickLang";

  document.querySelectorAll(".lang-switch button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var lang = btn.getAttribute("data-lang");
      localStorage.setItem(LANG_STORAGE_KEY, lang);
      document.querySelectorAll(".lang-switch button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      render(lang);
    });
  });

  var initialLang = localStorage.getItem(LANG_STORAGE_KEY) || "de";
  if (!CONTENT[initialLang]) initialLang = "de";
  document.querySelectorAll(".lang-switch button").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-lang") === initialLang);
  });
  render(initialLang);
</script>
