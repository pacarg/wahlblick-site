  };

  function render(lang) {
    document.documentElement.lang = lang;
    var c = CONTENT[lang];
    var f = FOOT[lang];
    document.title = c.title + " — Wahlblick";
    document.querySelector("[data-title]").textContent = c.title;
    document.querySelector("[data-intro]").textContent = c.intro;
    document.querySelector("[data-back]").textContent = c.backLabel;
    document.querySelector("[data-foot-back]").textContent = c.backLabel;
    document.querySelector("[data-foot-datenschutz]").textContent = f.datenschutz;
    document.querySelector("[data-foot-disclaimer]").textContent = f.disclaimer;
    document.querySelector("[data-foot-about]").textContent = f.about;
    document.querySelector("[data-foot-guide]").textContent = f.guide;
    document.querySelector("[data-group1-heading]").textContent = c.group1Heading;
    document.querySelector("[data-group2-heading]").textContent = c.group2Heading;
    document.querySelector("[data-note]").textContent = c.note;

    var status = STATUS_LABEL[lang];

    function renderGroup(selector, list) {
      var wrap = document.querySelector(selector);
      wrap.innerHTML = "";
      list.forEach(function (cat) {
        var card = document.createElement("div");
        card.className = "cat-card";
        var html = "<h3>" + cat.title + "</h3><p>" + cat.text + "</p>";
        if (cat.entries && cat.entries.length) {
          html += "<ul class=\"entries\">" + cat.entries.map(function (e) {
            var val = e.url
              ? "<a href=\"" + e.url + "\" target=\"_blank\" rel=\"noopener\">" + e.value + " ↗</a>"
              : e.value;
            return "<li><span>" + e.name + "</span><span class=\"val\">" + val + "</span></li>";
          }).join("") + "</ul>";
        } else {
          html += "<span class=\"status\">" + status + "</span>";
        }
        card.innerHTML = html;
        wrap.appendChild(card);
      });
    }
    renderGroup("[data-group1]", c.categories);
    renderGroup("[data-group2]", c.categoriesGroup2);
  }

  var LANG_STORAGE_KEY = "wahlblickLang";

  document.querySelectorAll(".lang-switch button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var lang = btn.getAttribute("data-lang");
      localStorage.setItem(LANG_STORAGE_KEY, lang);
      document.querySelectorAll(".lang-switch button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      render(lang);
    });
  });

  var initialLang = localStorage.getItem(LANG_STORAGE_KEY) || "de";
  if (!CONTENT[initialLang]) initialLang = "de";
  document.querySelectorAll(".lang-switch button").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-lang") === initialLang);
  });
  render(initialLang);
</script>
