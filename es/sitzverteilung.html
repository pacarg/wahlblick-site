  .hemi-total span { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .hemi-legend { display: flex; flex-wrap: wrap; gap: 10px 20px; justify-content: center; margin-top: 52px; max-width: 100%; }
  .hemi-legend .item { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; flex: none; white-space: nowrap; }
  .hemi-legend .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 720px) {

    .barrow { grid-template-columns: 78px 1fr; }

  }

<script>
(function () {
  "use strict";

  var CDU = "var(--p-cdu)", CSU = "var(--p-csu)", AFD = "var(--p-afd)", SPD = "var(--p-spd)",
      GRUENE = "var(--p-gruene)", LINKE = "var(--p-linke)", FDP = "var(--p-fdp)",
      BSW = "var(--p-bsw)", SSW = "var(--p-ssw)", SONST = "var(--p-sonst)";

  function resolveColor(c) {
    if (c.indexOf("var(") !== 0) return c;
    var name = c.slice(4, -1);
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  var LOCALE = { de: "de-DE", es: "es-ES", en: "en-US" };
  function fmtPct(n, lang) { return n.toLocaleString(LOCALE[lang] || "de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 2 }); }
  function fmtInt(n, lang) { return n.toLocaleString(LOCALE[lang] || "de-DE"); }

  // Real, verified 21st Bundestag (2025) results — bundeswahlleiterin.de
  // "zweit" = officially reported (rounded) percentage, used for display.
  // "exact" = votes / 49,649,512 total valid Zweitstimmen, used for the
  // live Sainte-Laguë simulator so it reproduces the real seat count at rest.
  var TOTAL_VOTES = 49649512;
  var PARTIES = [
    { key: "cdu",    color: CDU,    zweit: 22.6, votes: 11196374, seats: 164 },
    { key: "afd",    color: AFD,    zweit: 20.8, votes: 10328780, seats: 152 },
    { key: "spd",    color: SPD,    zweit: 16.4, votes: 8149124,  seats: 120 },
    { key: "gruene", color: GRUENE, zweit: 11.6, votes: 5762380,  seats: 85  },
    { key: "linke",  color: LINKE,  zweit: 8.8,  votes: 4356532,  seats: 64  },
    { key: "csu",    color: CSU,    zweit: 6.0,  votes: 2964028,  seats: 44  },
    { key: "ssw",    color: SSW,    zweit: 0.2,  votes: 76138,    seats: 1   }
  ];
  var BELOW = [
    { key: "bsw", color: BSW, zweit: 4.98, votes: 2472947 },
    { key: "fdp", color: FDP, zweit: 4.3,  votes: 2148837 }
  ];
  var SONST_SHARE = (TOTAL_VOTES - PARTIES.concat(BELOW).reduce(function (s, p) { return s + p.votes; }, 0)) / TOTAL_VOTES * 100;
  PARTIES.forEach(function (p) { p.exact = p.votes / TOTAL_VOTES * 100; });
  BELOW.forEach(function (p) { p.exact = p.votes / TOTAL_VOTES * 100; });

  function sainteLague(shares, totalSeats) {
    var qualifying = shares.filter(function (p) { return p.key !== "sonst" && (p.share >= THRESHOLD || p.key === "ssw"); });
    var seats = {};
    qualifying.forEach(function (p) { seats[p.key] = 0; });
    for (var i = 0; i < totalSeats; i++) {
      var bestKey = null, bestQ = -1;
      qualifying.forEach(function (p) {
        var q = p.share / (2 * seats[p.key] + 1);
        if (q > bestQ) { bestQ = q; bestKey = p.key; }
      });
      seats[bestKey]++;
    }
    var out = {};
    shares.forEach(function (p) { out[p.key] = seats[p.key] || 0; });
    return out;
  }

  var ALL_SHARES_BASE = PARTIES.concat(BELOW).concat([{ key: "sonst", exact: SONST_SHARE }]);
  var MOVABLE_PARTIES = ["cdu", "afd", "spd", "gruene", "linke", "csu"];

  function computeShares(movedKey, movedShare) {
    var others = ALL_SHARES_BASE.filter(function (p) { return p.key !== movedKey; });
    var othersSum = others.reduce(function (s, p) { return s + p.exact; }, 0);
    var remaining = 100 - movedShare;
    var scale = remaining / othersSum;
    return ALL_SHARES_BASE.map(function (p) {
      if (p.key === movedKey) return { key: p.key, share: movedShare };
      return { key: p.key, share: p.exact * scale };
    });
  }

  var colorByKey = {};
  ALL_SHARES_BASE.forEach(function (p) {
    var full = PARTIES.concat(BELOW).filter(function (q) { return q.key === p.key; })[0];
    colorByKey[p.key] = full ? full.color : SONST;

  function realSeatsFor(key) {
    var p = PARTIES.filter(function (q) { return q.key === key; })[0];
    return p ? p.seats : 0;
  }
  function realExactFor(key) {
    var p = ALL_SHARES_BASE.filter(function (q) { return q.key === key; })[0];
    return p ? p.exact : 0;
  }

  var svg = document.getElementById("hemicycle");
  var CX = 320, CY = 300;
  function hemicycleLayout(total, innerR, outerR, spacing) {
    var points = [], r = innerR, placed = 0;
    while (placed < total && r <= outerR) {
      var circumference = Math.PI * r;
      var seatsInRow = Math.max(1, Math.floor(circumference / spacing));
      var use = Math.min(seatsInRow, total - placed);
      for (var i = 0; i < use; i++) {
        var angle = Math.PI - (Math.PI * (i + 0.5)) / use;
        points.push({ x: CX + r * Math.cos(angle), y: CY - r * Math.sin(angle), angle: angle });
      }
      placed += use;
      r += spacing;
    }
    points.sort(function (a, b) { return b.angle - a.angle; });
    return points;
  }
  function renderHemicycle(lang) {
    svg.innerHTML = "";
    var order = PARTIES.slice().sort(function (a, b) { return b.seats - a.seats; });
    var total = order.reduce(function (s, p) { return s + p.seats; }, 0);
    var points = hemicycleLayout(total, 42, 300, 13.5);
    var idx = 0, legendHtml = "";
    order.forEach(function (p) {
      legendHtml += '<div class="item"><span class="sw" style="background:' + resolveColor(p.color) + '"></span>' + NAMES[lang][p.key] + ' <span class="num" style="color:var(--text-muted)">' + p.seats + '</span></div>';
      for (var i = 0; i < p.seats && idx < points.length; i++, idx++) {
        var pt = points[idx];
        var circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", pt.x.toFixed(1));
        circle.setAttribute("cy", pt.y.toFixed(1));
        circle.setAttribute("r", "5.2");
        circle.setAttribute("fill", resolveColor(p.color));
        circle.setAttribute("class", "seat-dot");
        var title = document.createElementNS("http://www.w3.org/2000/svg", "title");
        title.textContent = NAMES[lang][p.key];
        circle.appendChild(title);
        svg.appendChild(circle);
      }
    });
    document.getElementById("hemiLegend").innerHTML = legendHtml;
  }

  function render(lang) {
    document.documentElement.lang = lang;
    var c = CONTENT[lang];
    document.title = c.title + " — Wahlblick";
    document.querySelector("[data-title]").textContent = c.title;
    document.querySelector("[data-intro]").textContent = c.intro;
    document.querySelector("[data-back]").textContent = c.backLabel;
    document.querySelector("[data-foot-back]").textContent = c.backLabel;
    document.querySelector("[data-h-results]").textContent = c.hResults;
    document.querySelector("[data-sub-results]").textContent = c.subResults;
    document.querySelector("[data-note-results]").innerHTML = c.noteResults;
    document.querySelector("[data-h-threshold]").textContent = c.hThreshold;
    document.querySelector("[data-sub-threshold]").textContent = c.subThreshold;
    document.querySelector("[data-note-threshold]").innerHTML = c.noteThreshold;
    document.querySelector("[data-h-sl]").textContent = c.hSl;
    document.querySelector("[data-sub-sl]").textContent = c.subSl;
    document.querySelector("[data-sl-party-label]").textContent = c.slPartyLabel;
    document.querySelector("[data-sl-hint]").textContent = c.slHint;
    buildPartySelect(lang);
    document.querySelector("[data-h-mandates]").textContent = c.hMandates;
    document.querySelector("[data-sub-mandates]").textContent = c.subMandates;
    document.querySelector("[data-th-party]").textContent = c.thParty;
    document.querySelector("[data-th-won]").textContent = c.thWon;
    document.querySelector("[data-th-uncovered]").textContent = c.thUncovered;
    document.querySelector("[data-th-seated]").textContent = c.thSeated;
    document.querySelector("[data-mandates-text]").textContent = c.mandatesText;
    document.querySelector("[data-candidate-meta]").textContent = c.candidateMeta;
    document.querySelector("[data-cand-k1]").textContent = c.candK1;
    document.querySelector("[data-cand-k2]").textContent = c.candK2;
    document.querySelector("[data-cand-k3]").textContent = c.candK3;
    document.querySelector("[data-cand-verdict]").textContent = c.candVerdict;
    document.querySelector("[data-h-hemi]").textContent = c.hHemi;
    document.querySelector("[data-sub-hemi]").textContent = c.subHemi;
    document.querySelector("[data-hemi-seats-label]").textContent = c.hemiSeatsLabel;
    document.querySelector("[data-hemi-text]").textContent = c.hemiText;
    document.querySelector("[data-h-sources]").textContent = c.hSources;
    document.querySelector("[data-sources-text]").textContent = c.sourcesText;
    document.querySelector("[data-foot-datenschutz]").textContent = c.datenschutz;
    document.querySelector("[data-foot-disclaimer]").textContent = c.disclaimer;
    document.querySelector("[data-foot-about]").textContent = c.about;
    document.querySelector("[data-foot-guide]").textContent = c.guide;
    document.querySelector("[data-related-heading]").textContent = c.relatedHeading;
    document.querySelector("[data-rc-parties-t]").textContent = c.relatedPartiesT;
    document.querySelector("[data-rc-parties-d]").textContent = c.relatedPartiesD;
    document.querySelector("[data-rc-gov-t]").textContent = c.relatedGovT;
    document.querySelector("[data-rc-gov-d]").textContent = c.relatedGovD;
    document.querySelector("[data-rc-faq-t]").textContent = c.relatedFaqT;
    document.querySelector("[data-rc-faq-d]").textContent = c.relatedFaqD;

    buildResultsBars(lang);
    buildThresholdBars(lang);
    buildMandateTable(lang);
    renderSl(lang, movedKey, sliderTouched ? parseInt(document.getElementById("slSlider").value, 10) / 10 : realExactFor(movedKey));
    renderHemicycle(lang);
  }

  function buildPartySelect(lang) {
    var select = document.getElementById("slPartySelect");
    var prev = select.value;
    select.innerHTML = "";
    MOVABLE_PARTIES.forEach(function (key) {
      var opt = document.createElement("option");
      opt.value = key;
      opt.textContent = NAMES[lang][key];
      select.appendChild(opt);
    });
    select.value = prev || movedKey;
  }

  var currentLang = "de";
  var movedKey = "cdu";
  var sliderTouched = false;

  document.getElementById("slPartySelect").addEventListener("change", function () {
    movedKey = this.value;
    sliderTouched = false;
    var tick = Math.round(realExactFor(movedKey) * 10);
    document.getElementById("slSlider").value = tick;
    renderSl(currentLang, movedKey, realExactFor(movedKey));
  });
  document.getElementById("slSlider").addEventListener("input", function () {
    sliderTouched = true;
    renderSl(currentLang, movedKey, parseInt(this.value, 10) / 10);
  });

  document.querySelectorAll(".lang-switch button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var lang = btn.getAttribute("data-lang");
      currentLang = lang;
      localStorage.setItem("wahlblickLang", lang);
      document.querySelectorAll(".lang-switch button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      render(lang);
    });
  });

  var initialLang = localStorage.getItem("wahlblickLang") || "de";
  if (!CONTENT[initialLang]) initialLang = "de";
  currentLang = initialLang;
  document.querySelectorAll(".lang-switch button").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-lang") === initialLang);
  });
  render(initialLang);
})();
</script>
</body>
</html>
