    max-width: 1200px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;

    gap: 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; flex: none; text-decoration: none; }
  .brand .badge {
    width: 34px; height: 34px;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px;
    flex: none;
  }
  .brand .flag-bar {
    width: 7px; height: 34px;
    border-radius: 2px;
    flex: none;
    background: linear-gradient(to bottom, #000 0% 33.33%, #dd0000 33.33% 66.66%, #ffce00 66.66% 100%);
  }
  .brand .wordmark { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; color: var(--text); white-space: nowrap; }

  .header-right { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
  .back-link { font-size: 13px; font-weight: 600; text-decoration: none; color: var(--text); white-space: nowrap; }
  .back-link:hover { color: var(--accent); }

  .lang-switch { display: flex; align-items: center; gap: 2px; flex: none; }
  .lang-switch button {
    border: none; background: none; color: var(--text-muted);
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.02em;
    padding: 5px 7px; cursor: pointer; border-radius: var(--radius);
  }
  .lang-switch button:hover { color: var(--text); background: var(--surface); }
  .lang-switch button.active { color: var(--accent); }
  .lang-switch .sep { color: var(--border); font-size: 12px; }

  main { max-width: 760px; margin: 0 auto; padding: 32px 24px 56px; }
  .page-kicker { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 9px; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.14; margin: 0 0 24px; }

  .panel {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 16px; margin: 0 0 14px; }
  .panel p { font-size: 15px; line-height: 1.65; margin: 0 0 14px; color: var(--text); }
  .panel p:last-child { margin-bottom: 0; }

  .fig { width: 100%; height: auto; display: block; margin: 18px 0 8px; }
  .fig text { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .gf-chrome { font-size: 13px; font-weight: 700; }
  .gf-num { font-size: 12px; font-weight: 800; fill: #fff; }
  .gf-lbl { font-size: 12px; font-weight: 700; fill: var(--text-muted); }
  .fig-cap { font-size: 12.5px; color: var(--text-muted); line-height: 1.55; margin: 0; }
  .fig-cap b { color: var(--accent); font-weight: 800; }

  footer {
    max-width: 1200px; margin: 0 auto; padding: 18px 24px 40px;
    border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-muted);
  }
  footer .foot-links { display: flex; gap: 8px 18px; flex-wrap: wrap; }
  footer .foot-links a { display: inline-flex; align-items: center; min-height: 24px; }
  footer a { color: var(--text-muted); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 720px) {
    .header-inner { padding: 12px 16px; flex-wrap: wrap; row-gap: 8px; }
    .brand .wordmark { font-size: 16px; }
    main { padding: 24px 16px 40px; }
    .panel { padding: 20px; }
    h1 { font-size: 25px; }
    footer { padding: 16px 16px 32px; }
  }

    de: { datenschutz: "Datenschutzerklärung", disclaimer: "Haftungsausschluss", grundgesetz: "Grundgesetz", about: "Über Wahlblick", directory: "Adressverzeichnis", holidays: "Feiertage", government: "Koalitionen", parties: "Parteien" },

  };

  function render(lang) {
    document.documentElement.lang = lang;
    var c = CONTENT[lang];
    var f = FOOT[lang];
    document.title = c.title + " — Wahlblick";
    document.querySelector("[data-title]").textContent = c.title;
    var kEl = document.querySelector("[data-kicker]"); if (kEl) kEl.textContent = c.kicker;
    document.querySelector("[data-back]").textContent = c.backLabel;
    document.querySelector("[data-foot-back]").textContent = c.backLabel;
    document.querySelector("[data-foot-datenschutz]").textContent = f.datenschutz;
    document.querySelector("[data-foot-disclaimer]").textContent = f.disclaimer;
    document.querySelector("[data-foot-about]").textContent = f.about;
    document.querySelector("[data-h-map]").textContent = c.hMap;
    document.querySelector("[data-map-p1]").textContent = c.mapP1;
    document.querySelector("[data-map-p2]").textContent = c.mapP2;
    document.querySelector("[data-h-views]").textContent = c.hViews;
    document.querySelector("[data-views-p1]").textContent = c.viewsP1;
    document.querySelector("[data-views-p2]").textContent = c.viewsP2;
    document.querySelector("[data-h-compare]").textContent = c.hCompare;
    document.querySelector("[data-compare-p1]").textContent = c.compareP1;
    document.querySelector("[data-h-partyview]").textContent = c.hPartyview;
    document.querySelector("[data-partyview-p1]").textContent = c.partyviewP1;
    document.querySelector("[data-partyview-p2]").textContent = c.partyviewP2;
    document.querySelector("[data-h-search]").textContent = c.hSearch;
    document.querySelector("[data-search-p1]").textContent = c.searchP1;
    document.querySelector("[data-h-nav]").textContent = c.hNav;
    document.querySelector("[data-nav-p1]").textContent = c.navP1;
    document.querySelector("[data-nav-p2]").textContent = c.navP2;
    document.querySelector("[data-h-sources]").textContent = c.hSources;
    document.querySelector("[data-sources-p1]").textContent = c.sourcesP1;
    document.querySelector("[data-figmap-cap]").innerHTML = c.figMapCap;
    document.querySelector("[data-figviews-cap]").innerHTML = c.figViewsCap;
    document.querySelector("[data-figcompare-cap]").innerHTML = c.figCompareCap;
    document.querySelector("[data-figparty-cap]").innerHTML = c.figPartyCap;
    document.querySelector("[data-figsearch-cap]").innerHTML = c.figSearchCap;
    document.querySelector("[data-fignav-cap]").innerHTML = c.figNavCap;
    document.querySelector("[data-figsources-cap]").innerHTML = c.figSourcesCap;
  }

  var LANG_STORAGE_KEY = "wahlblickLang";

  document.querySelectorAll(".lang-switch button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var lang = btn.getAttribute("data-lang");
      localStorage.setItem(LANG_STORAGE_KEY, lang);
      document.querySelectorAll(".lang-switch button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      render(lang);
    });
  });

  var initialLang = localStorage.getItem(LANG_STORAGE_KEY) || "de";
  if (!CONTENT[initialLang]) initialLang = "de";
  document.querySelectorAll(".lang-switch button").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-lang") === initialLang);
  });
  render(initialLang);
</script>
