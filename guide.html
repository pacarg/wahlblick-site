<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f8f9;
    --border: #e3e6ea;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --accent: #004494;
    --accent-ink: #ffffff;
    --strip-bg: #12161c;
    --strip-text: #c7cdd6;
    --radius: 4px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }

  .site-header { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; flex: none; text-decoration: none; }
  .brand .badge {
    width: 34px; height: 34px;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px;
    flex: none;
  }
  .brand .flag-bar {
    width: 7px; height: 34px;
    border-radius: 2px;
    flex: none;
    background: linear-gradient(to bottom, #000 0% 33.33%, #dd0000 33.33% 66.66%, #ffce00 66.66% 100%);
  }
  .brand .wordmark { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; color: var(--text); white-space: nowrap; }

  .header-right { display: flex; align-items: center; gap: 16px; flex: none; }
  .back-link { font-size: 13px; font-weight: 600; text-decoration: none; color: var(--text); white-space: nowrap; }
  .back-link:hover { color: var(--accent); }

  .lang-switch { display: flex; align-items: center; gap: 2px; flex: none; }
  .lang-switch button {
    border: none; background: none; color: var(--text-muted);
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.02em;
    padding: 5px 7px; cursor: pointer; border-radius: var(--radius);
  }
  .lang-switch button:hover { color: var(--text); background: var(--surface); }
  .lang-switch button.active { color: var(--accent); }
  .lang-switch .sep { color: var(--border); font-size: 12px; }

  main { max-width: 760px; margin: 0 auto; padding: 32px 24px 56px; }
  h1 { font-size: 22px; margin: 0 0 24px; }

  .panel {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 16px; margin: 0 0 14px; }
  .panel p { font-size: 14.5px; line-height: 1.65; margin: 0 0 14px; color: var(--text); }
  .panel p:last-child { margin-bottom: 0; }

  footer {
    max-width: 1200px; margin: 0 auto; padding: 18px 24px 40px;
    border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-muted);
  }
  footer .foot-links { display: flex; gap: 16px; flex-wrap: wrap; row-gap: 8px; }
  footer a { color: var(--text-muted); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 720px) {
    .header-inner { padding: 12px 16px; flex-wrap: wrap; row-gap: 8px; }
    .brand .wordmark { font-size: 16px; }
    main { padding: 24px 16px 40px; }
    .panel { padding: 20px; }
    footer { padding: 16px 16px 32px; }
  }
</style>

<script>
  var CONTENT = {
    de: {
      title: "Nutzungshinweise",

      mapP2: "Das ausgewählte Bundesland wird auf der Karte hervorgehoben (Umriss-Glow) und sein Name erscheint größer. Über das Suchfeld oder die Länder-Reiter lässt es sich ebenso auswählen.",
      hViews: "Zwei Ansichten: Bundestag und Landtag",

      viewsP2: "Für viele Länder ist auch ein längerer Verlauf hinterlegt: Sobald Sie ein Bundesland in der Landtag-Ansicht auswählen, erscheinen kleine Jahres-Reiter über dem Ergebnis, mit denen Sie zu früheren Wahlen desselben Landes zurückblättern können.",
      hCompare: "Länder vergleichen",

      hPartyview: "Eine Partei in allen 16 Ländern",

      partyviewP2: "Während diese Ansicht aktiv ist, können Sie zusätzlich einzelne Länder auf der Karte anklicken, um die Liste auf genau diese Regionen einzugrenzen — so lässt sich zum Beispiel eine Partei gezielt in wenigen ausgewählten Ländern vergleichen.",
      hSearch: "Suche und Sprache",
      searchP1: "Das Suchfeld oben findet ein Bundesland nach Namen (in jeder der drei Sprachen). Der Sprachumschalter DE/ES/EN übersetzt die gesamte Oberfläche — nur die Namen der politischen Parteien bleiben unübersetzt, das entspricht journalistischer Praxis.",
      hNav: "Weitere Inhalte finden",
      navP1: "Neben den Wahl-Reitern führen zwei Menüs zu weiterführenden Inhalten: „Die Parteien“ (Parteiprofile und Erklärung der Koalitionsarten) und „Deutschland“ (Grundgesetz, Adressverzeichnis, Feiertage). Auf dem Handy sammelt ein Menü-Symbol (☰) dieselben Links, gruppiert unter denselben zwei Überschriften.",
      navP2: "Im Footer stehen außerdem das Impressum, der Haftungsausschluss und die Seite „Über Wahlblick“ mit der Methodik hinter den Daten.",
      hSources: "Woher die Daten kommen",
      sourcesP1: "Jedes einzelne Ergebnis verlinkt auf seine offizielle Quelle — die Bundeswahlleiterin für den Bundestag, die jeweilige Landeswahlbehörde für jeden Landtag. Mehr zur Arbeitsweise auf der Seite „Über Wahlblick“."
    },
    es: {
      title: "Guía de uso",
      backLabel: "← Volver al mapa",
      hMap: "Cómo funciona el mapa",
      mapP1: "Pasá el mouse sobre un estado federado para ver su nombre y color. Hacé click para ver el resultado completo —partidos, porcentajes, participación y fuente— en el panel de la derecha.",
      mapP2: "El estado seleccionado queda resaltado en el mapa (con un brillo en el contorno) y su nombre aparece más grande. También podés seleccionarlo desde el buscador o desde las tabs de estados.",
      hViews: "Dos vistas: Bundestag y Landtag",
      viewsP1: "Arriba podés alternar entre dos vistas. «Bundestag» muestra la elección federal con selector de año completo (2013, 2017, 2021 y 2025 — los cuatro con datos reales para los 16 estados). «Landtag» muestra la última elección estatal ya finalizada de cada Land — como cada uno vota en una fecha distinta, acá no hay un año en común.",
      viewsP2: "Para muchos estados también hay historial cargado: al seleccionar un Land en la vista Landtag, aparecen pestañas chicas de año arriba del resultado, para ver elecciones anteriores de ese mismo estado.",
      hCompare: "Comparar estados",
      compareP1: "Con el botón «Comparar», junto al mapa, podés elegir hasta tres estados federados a la vez (desde el mapa, la lista o el buscador) y ver sus resultados lado a lado en una tabla — funciona tanto en Bundestag como en Landtag.",
      hPartyview: "Un partido en los 16 estados",
      partyviewP1: "El selector «Vista por partido» colorea el mapa según la fuerza de un partido específico y muestra a la derecha un ranking de los 16 estados, ordenados por porcentaje de votos.",
      partyviewP2: "Con esta vista activa, también podés clickear estados puntuales en el mapa para filtrar la lista a solo esas regiones — útil para comparar un partido en un grupo chico de estados elegidos por vos.",
      hSearch: "Buscador e idioma",
      searchP1: "El buscador de arriba encuentra un estado federado por nombre (en cualquiera de los 3 idiomas). El selector DE/ES/EN traduce toda la interfaz — los nombres de los partidos políticos quedan sin traducir, siguiendo la práctica periodística habitual.",
      hNav: "Encontrar más contenido",
      navP1: "Junto a las tabs de elección hay dos menús con más contenido: «Los partidos» (perfiles de cada partido y explicación de los tipos de coalición) y «Alemania» (Ley Fundamental, directorio de direcciones, feriados). En el celular, un ícono de menú (☰) agrupa los mismos links bajo esos mismos dos títulos.",
      navP2: "En el footer también están el Impressum, el descargo de responsabilidad, y la página «Sobre Wahlblick» con la metodología detrás de los datos.",
      hSources: "De dónde vienen los datos",
      sourcesP1: "Cada resultado individual tiene un link a su fuente oficial — la Bundeswahlleiterin para el Bundestag, la autoridad electoral de cada estado para su Landtag. Más sobre la metodología en la página «Sobre Wahlblick»."
    },
    en: {
      title: "User guide",
      backLabel: "← Back to the map",
      hMap: "How the map works",
      mapP1: "Hover over a federal state to see its name and color. Click it to see the full result — parties, percentages, turnout, and source — in the panel on the right.",
      mapP2: "The selected state is highlighted on the map (with an outline glow) and its name appears larger. You can also select it from the search box or the state tabs.",
      hViews: "Two views: Bundestag and Landtag",
      viewsP1: "At the top you can switch between two views. “Bundestag” shows the federal election with a full year selector (2013, 2017, 2021, and 2025 — all four with real data for all 16 states). “Landtag” shows each state's most recently completed state election — since each state votes on its own schedule, there's no shared year here.",
      viewsP2: "Many states also have a longer history available: once you select a state in the Landtag view, small year tabs appear above the results, letting you browse that state's earlier elections.",
      hCompare: "Compare states",

      partyviewP1: "The “Party view” dropdown colors the map by a single party's strength and shows a ranking of all 16 states on the right, sorted by vote share.",

      searchP1: "The search box at the top finds a federal state by name (in any of the 3 languages). The DE/ES/EN switch translates the whole interface — only political party names stay untranslated, following standard journalistic practice.",
      hNav: "Finding more content",
      navP1: "Next to the election tabs, two menus lead to further content: “Parties” (party profiles and an explanation of coalition types) and “Germany” (the Basic Law, the address directory, public holidays). On mobile, a menu icon (☰) collects the same links under those same two headings.",
      navP2: "The footer also has the Impressum, the disclaimer, and the “About Wahlblick” page with the methodology behind the data.",
      hSources: "Where the data comes from",
      sourcesP1: "Every single result links to its official source — the Federal Returning Officer for the Bundestag, each state's own electoral authority for its Landtag. More on the methodology on the “About Wahlblick” page."
    }
  };

  var FOOT = {
    de: { datenschutz: "Datenschutzerklärung", disclaimer: "Haftungsausschluss", grundgesetz: "Grundgesetz", about: "Über Wahlblick", directory: "Adressverzeichnis", holidays: "Feiertage", government: "Koalitionen", parties: "Parteien" },
    es: { datenschutz: "Política de privacidad", disclaimer: "Descargo de responsabilidad", grundgesetz: "Ley Fundamental", about: "Sobre Wahlblick", directory: "Directorio", holidays: "Feriados", government: "Coaliciones", parties: "Partidos" },
    en: { datenschutz: "Privacy Policy", disclaimer: "Disclaimer", grundgesetz: "Basic Law", about: "About Wahlblick", directory: "Directory", holidays: "Holidays", government: "Coalitions", parties: "Parties" }
  };

  function render(lang) {
    document.documentElement.lang = lang;
    var c = CONTENT[lang];
    var f = FOOT[lang];
    document.title = c.title + " — Wahlblick";
    document.querySelector("[data-title]").textContent = c.title;
    document.querySelector("[data-back]").textContent = c.backLabel;
    document.querySelector("[data-foot-back]").textContent = c.backLabel;
    document.querySelector("[data-foot-datenschutz]").textContent = f.datenschutz;
    document.querySelector("[data-foot-disclaimer]").textContent = f.disclaimer;
    document.querySelector("[data-foot-grundgesetz]").textContent = f.grundgesetz;
    document.querySelector("[data-foot-about]").textContent = f.about;
    document.querySelector("[data-foot-directory]").textContent = f.directory;
    document.querySelector("[data-foot-holidays]").textContent = f.holidays;
    document.querySelector("[data-foot-government]").textContent = f.government;
    document.querySelector("[data-foot-parties]").textContent = f.parties;
    document.querySelector("[data-h-map]").textContent = c.hMap;
    document.querySelector("[data-map-p1]").textContent = c.mapP1;
    document.querySelector("[data-map-p2]").textContent = c.mapP2;
    document.querySelector("[data-h-views]").textContent = c.hViews;
    document.querySelector("[data-views-p1]").textContent = c.viewsP1;
    document.querySelector("[data-views-p2]").textContent = c.viewsP2;
    document.querySelector("[data-h-compare]").textContent = c.hCompare;
    document.querySelector("[data-compare-p1]").textContent = c.compareP1;
    document.querySelector("[data-h-partyview]").textContent = c.hPartyview;
    document.querySelector("[data-partyview-p1]").textContent = c.partyviewP1;
    document.querySelector("[data-partyview-p2]").textContent = c.partyviewP2;
    document.querySelector("[data-h-search]").textContent = c.hSearch;
    document.querySelector("[data-search-p1]").textContent = c.searchP1;
    document.querySelector("[data-h-nav]").textContent = c.hNav;
    document.querySelector("[data-nav-p1]").textContent = c.navP1;
    document.querySelector("[data-nav-p2]").textContent = c.navP2;
    document.querySelector("[data-h-sources]").textContent = c.hSources;
    document.querySelector("[data-sources-p1]").textContent = c.sourcesP1;
  }

  var LANG_STORAGE_KEY = "wahlblickLang";

  document.querySelectorAll(".lang-switch button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var lang = btn.getAttribute("data-lang");
      localStorage.setItem(LANG_STORAGE_KEY, lang);
      document.querySelectorAll(".lang-switch button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      render(lang);
    });
  });

  var initialLang = localStorage.getItem(LANG_STORAGE_KEY) || "de";
  if (!CONTENT[initialLang]) initialLang = "de";
  document.querySelectorAll(".lang-switch button").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-lang") === initialLang);
  });
  render(initialLang);
</script>
</body>
</html>
