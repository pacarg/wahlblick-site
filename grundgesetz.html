        { num: "Art. 2", title: "Freie Entfaltung, Leben, körperliche Unversehrtheit", text: "Jede Person hat das Recht auf freie Entfaltung der Persönlichkeit, auf Leben und körperliche Unversehrtheit sowie auf Freiheit der Person — jeweils im Rahmen der Rechte anderer und der verfassungsmäßigen Ordnung." },

        { num: "Art. 4", title: "Glaubens-, Gewissens- und Bekenntnisfreiheit", text: "Die Freiheit des Glaubens, des Gewissens und des religiösen sowie weltanschaulichen Bekenntnisses ist unverletzlich. Niemand darf zum Kriegsdienst mit der Waffe gezwungen werden." },

        { num: "Art. 7", title: "Schulwesen", text: "Das gesamte Schulwesen steht unter der Aufsicht des Staates. Erziehungsberechtigte haben das Recht, über die Teilnahme ihrer Kinder am Religionsunterricht zu entscheiden." },
        { num: "Art. 8", title: "Versammlungsfreiheit", text: "Alle Deutschen haben das Recht, sich ohne Anmeldung friedlich und ohne Waffen zu versammeln. Für Versammlungen unter freiem Himmel kann dieses Recht durch Gesetz eingeschränkt werden." },
        { num: "Art. 9", title: "Vereinigungs- und Koalitionsfreiheit", text: "Alle Deutschen haben das Recht, Vereine und Gesellschaften zu bilden. Das Recht, Vereinigungen zur Wahrung und Förderung der Arbeits- und Wirtschaftsbedingungen zu bilden (z. B. Gewerkschaften), ist für jede Person und jeden Beruf gewährleistet." },
        { num: "Art. 10", title: "Brief-, Post- und Fernmeldegeheimnis", text: "Das Brief-, Post- und Fernmeldegeheimnis ist unverletzlich. Einschränkungen dürfen nur aufgrund eines Gesetzes angeordnet werden." },

        { num: "Art. 12", title: "Berufsfreiheit", text: "Alle Deutschen haben das Recht, Beruf, Arbeitsplatz und Ausbildungsstätte frei zu wählen. Ein Arbeitszwang ist grundsätzlich verboten; eine allgemeine Dienstpflicht (Art. 12a) ist nur in engen, vom Grundgesetz selbst festgelegten Grenzen möglich." },

        { num: "Art. 16 / 16a", title: "Staatsangehörigkeit, Auslieferung, Asylrecht", text: "Die deutsche Staatsangehörigkeit darf nicht entzogen werden; deutsche Staatsbürger*innen dürfen grundsätzlich nicht ausgeliefert werden. Politisch Verfolgte genießen Asylrecht." },
        { num: "Art. 17 / 17a", title: "Petitionsrecht", text: "Jede Person hat das Recht, sich einzeln oder gemeinsam mit anderen schriftlich mit Bitten oder Beschwerden an die zuständigen Stellen und an die Volksvertretung zu wenden." },
        { num: "Art. 18", title: "Verwirkung von Grundrechten", text: "Wer Grundrechte — etwa die Meinungs- oder Versammlungsfreiheit — zum Kampf gegen die freiheitliche demokratische Grundordnung missbraucht, verwirkt diese Rechte. Das Bundesverfassungsgericht entscheidet darüber." },

    es: {

      intro: "La Ley Fundamental para la República Federal de Alemania fue proclamada el 23 de mayo de 1949 por el Consejo Parlamentario en Bonn — pensada originalmente como una constitución provisional para Alemania Occidental, de ahí el nombre deliberadamente modesto de «Ley Fundamental» en vez de «Constitución». Con la reunificación alemana de 1990 pasó a ser la constitución de toda Alemania. Comienza con los derechos fundamentales (Art. 1–19) — una lección directa de la época del nacionalsocialismo, cuando la Constitución de Weimar no ofreció suficiente protección frente al vaciamiento de la democracia.",

      articles: [
        { num: "Art. 1", title: "Dignidad humana", text: "La dignidad humana es intangible. Respetarla y protegerla es obligación de todo poder estatal — el principio central e inmodificable de toda la Ley Fundamental." },
        { num: "Art. 2", title: "Libre desarrollo, vida e integridad física", text: "Toda persona tiene derecho al libre desarrollo de su personalidad, a la vida y a la integridad física, así como a la libertad personal — dentro de los límites de los derechos de terceros y del orden constitucional." },
        { num: "Art. 3", title: "Igualdad ante la ley", text: "Todas las personas son iguales ante la ley. Hombres y mujeres tienen los mismos derechos. Nadie puede ser perjudicado por su sexo, origen, idioma, patria, creencias o discapacidad." },
        { num: "Art. 4", title: "Libertad de creencia, conciencia y confesión", text: "La libertad de creencia, de conciencia y de confesión religiosa e ideológica es inviolable. Nadie puede ser obligado a prestar servicio militar armado en contra de su conciencia." },
        { num: "Art. 5", title: "Libertad de expresión, prensa, arte y ciencia", text: "Toda persona tiene derecho a expresar y difundir libremente su opinión. Se garantiza la libertad de prensa, radiodifusión y cine, así como del arte, la ciencia, la investigación y la enseñanza. No existe censura." },
        { num: "Art. 6", title: "Matrimonio, familia e hijos", text: "El matrimonio y la familia gozan de la protección especial del Estado. El cuidado y la educación de los hijos son un derecho natural de los padres, sobre cuyo ejercicio vela la comunidad estatal." },
        { num: "Art. 7", title: "Sistema escolar", text: "Todo el sistema escolar está bajo la supervisión del Estado. Quienes tienen la responsabilidad educativa de un menor pueden decidir sobre su participación en la clase de religión." },

        { num: "Art. 9", title: "Libertad de asociación y sindical", text: "Todos los alemanes tienen derecho a formar asociaciones y sociedades. El derecho a formar asociaciones para la defensa y mejora de las condiciones laborales y económicas (por ejemplo, sindicatos) está garantizado para toda persona y profesión." },
        { num: "Art. 10", title: "Secreto de correspondencia, correo y telecomunicaciones", text: "El secreto de la correspondencia, así como del correo y las telecomunicaciones, es inviolable. Solo puede restringirse en virtud de una ley." },

        { num: "Art. 12", title: "Libertad profesional", text: "Todos los alemanes tienen derecho a elegir libremente su profesión, lugar de trabajo y centro de formación. El trabajo forzoso está prohibido en principio; un servicio obligatorio general (Art. 12a) solo es posible dentro de límites estrechos fijados por la propia Ley Fundamental." },

    en: {
      title: "The Basic Law (Grundgesetz)",
      intro: "The Basic Law for the Federal Republic of Germany was proclaimed on 23 May 1949 by the Parliamentary Council in Bonn — originally conceived as a provisional constitution for West Germany, hence the deliberately modest name \"Basic Law\" rather than \"Constitution.\" With German reunification in 1990, it became the constitution of all of Germany. It opens with the fundamental rights (Art. 1–19) — a direct lesson from the Nazi era, when the Weimar Constitution failed to protect democracy from being hollowed out.",
      backLabel: "← Back to the map",
      artHeading: "The fundamental rights (Art. 1–19)",
      artSub: "The first section of the Basic Law — summarized in plain language, not an official reproduction of the text.",
      structHeading: "The rest of the Basic Law, at a glance",
      structSub: "The remaining ten sections (Art. 20–146) regulate the structure of the state — shown here as a summary, not article by article.",
      officialLink: "Full official text: <a href=\"https://www.gesetze-im-internet.de/gg/\" target=\"_blank\" rel=\"noopener\">gesetze-im-internet.de/gg</a> (Federal Ministry of Justice, in German).",
      articles: [
        { num: "Art. 1", title: "Human dignity", text: "Human dignity is inviolable. To respect and protect it is the duty of all state authority — the central, unamendable principle underlying the entire Basic Law." },
        { num: "Art. 2", title: "Free development, life, physical integrity", text: "Everyone has the right to free development of their personality, to life and physical integrity, and to personal liberty — within the limits of others' rights and the constitutional order." },
        { num: "Art. 3", title: "Equality before the law", text: "All people are equal before the law. Men and women have equal rights. No one may be disadvantaged on account of sex, ancestry, language, homeland, beliefs, or disability." },
        { num: "Art. 4", title: "Freedom of faith, conscience and creed", text: "Freedom of faith, conscience, and religious or ideological creed is inviolable. No one may be compelled to perform armed military service against their conscience." },
        { num: "Art. 5", title: "Freedom of expression, press, art and science", text: "Everyone has the right to freely express and disseminate their opinions. Freedom of the press, broadcasting, and film is guaranteed, as are art, science, research, and teaching. There is no censorship." },
        { num: "Art. 6", title: "Marriage, family and children", text: "Marriage and the family enjoy the special protection of the state. The care and upbringing of children is the natural right of parents, and the state community watches over how they exercise it." },
        { num: "Art. 7", title: "School system", text: "The entire school system is under the supervision of the state. Parents or guardians have the right to decide whether their children take part in religious education." },
        { num: "Art. 8", title: "Freedom of assembly", text: "All Germans have the right to assemble peacefully and unarmed without prior notice. For assemblies held outdoors, this right may be restricted by law." },
        { num: "Art. 9", title: "Freedom of association", text: "All Germans have the right to form associations and societies. The right to form associations to safeguard and improve working and economic conditions (e.g., trade unions) is guaranteed to everyone, in every profession." },
        { num: "Art. 10", title: "Privacy of correspondence, post and telecommunications", text: "The privacy of correspondence, posts, and telecommunications is inviolable. Restrictions may only be ordered pursuant to a law." },
        { num: "Art. 11", title: "Freedom of movement", text: "All Germans enjoy freedom of movement throughout the federal territory — that is, the right to settle and reside anywhere." },
        { num: "Art. 12", title: "Freedom of occupation", text: "All Germans have the right to freely choose their occupation, place of work, and place of training. Compulsory labour is prohibited in principle; general compulsory service (Art. 12a) is only possible within narrow limits set by the Basic Law itself." },
        { num: "Art. 13", title: "Inviolability of the home", text: "The home is inviolable. Searches may, as a rule, only be ordered by a judge." },
        { num: "Art. 14", title: "Property, inheritance and expropriation", text: "Property and the right of inheritance are guaranteed; their substance is defined by law. Property entails obligations — its use should also serve the public good. Expropriation is only permissible for the public good and against compensation." },
        { num: "Art. 15", title: "Socialization", text: "Land, natural resources, and means of production may, by law, be transferred to public ownership for the purpose of socialization — a provision that has almost never been used in practice." },
        { num: "Art. 16 / 16a", title: "Citizenship, extradition, right to asylum", text: "No one may be deprived of German citizenship; German citizens may, as a rule, not be extradited. Persons persecuted on political grounds enjoy the right of asylum." },
        { num: "Art. 17 / 17a", title: "Right to petition", text: "Everyone has the right, individually or jointly with others, to address written requests or complaints to the competent authorities and to the legislature." },
        { num: "Art. 18", title: "Forfeiture of basic rights", text: "Anyone who abuses basic rights — such as freedom of expression or assembly — to combat the free democratic basic order forfeits those rights. The Federal Constitutional Court rules on this forfeiture." },
        { num: "Art. 19", title: "Restriction of basic rights, guarantee of recourse to the courts", text: "Basic rights may only be restricted by or pursuant to a law, and their essential content may never be affected. Anyone whose rights are violated by public authority has recourse to the courts." }
      ],

        { range: "Art. 38–49", title: "III. The Bundestag", text: "Election, composition, and functioning of the Bundestag — the parliament elected by the people." },
        { range: "Art. 50–53a", title: "IV / IVa. Bundesrat, Joint Committee", text: "The Bundesrat represents the 16 Länder at the federal level; the Joint Committee convenes only in a state of defence." },
        { range: "Art. 54–61", title: "V. The Federal President", text: "Election and duties of the head of state — mostly representative, with few active powers." },
        { range: "Art. 62–69", title: "VI. The Federal Government", text: "The Chancellor and federal ministers, government formation, the vote of confidence." },

        { range: "Art. 83–91e", title: "VIII / VIIIa. Administration, joint tasks", text: "How federal laws are executed, and which tasks the Federation and the Länder carry out together." },
        { range: "Art. 92–104", title: "IX. The judiciary", text: "Independence of the courts, the Federal Constitutional Court as guardian of the Basic Law." },
        { range: "Art. 104a–115l", title: "X / Xa. Public finances, state of defence", text: "How tax revenue and spending are divided between the Federation and the Länder; special rules for a state of defence." },

  var FOOT = {
    de: { datenschutz: "Datenschutzerklärung", disclaimer: "Haftungsausschluss", about: "Über Wahlblick", directory: "Adressverzeichnis", guide: "Nutzungshinweise" },
    es: { datenschutz: "Política de privacidad", disclaimer: "Descargo de responsabilidad", about: "Sobre Wahlblick", directory: "Directorio", guide: "Guía de uso" },
    en: { datenschutz: "Privacy Policy", disclaimer: "Disclaimer", about: "About Wahlblick", directory: "Directory", guide: "User Guide" }
  };

  function render(lang) {
    var c = CONTENT[lang];
    var f = FOOT[lang];
    document.title = c.title + " — Wahlblick";
    document.querySelector("[data-title]").textContent = c.title;
    document.querySelector("[data-intro]").textContent = c.intro;
    document.querySelector("[data-back]").textContent = c.backLabel;
    document.querySelector("[data-foot-back]").textContent = c.backLabel;
    document.querySelector("[data-foot-datenschutz]").textContent = f.datenschutz;
    document.querySelector("[data-foot-disclaimer]").textContent = f.disclaimer;
    document.querySelector("[data-foot-about]").textContent = f.about;
    document.querySelector("[data-foot-directory]").textContent = f.directory;
    document.querySelector("[data-foot-guide]").textContent = f.guide;
    document.querySelector("[data-art-heading]").textContent = c.artHeading;
    document.querySelector("[data-art-sub]").textContent = c.artSub;
    document.querySelector("[data-struct-heading]").textContent = c.structHeading;
    document.querySelector("[data-struct-sub]").textContent = c.structSub;
    document.querySelector("[data-official-link]").innerHTML = c.officialLink;

    var artWrap = document.querySelector("[data-articles]");
    artWrap.innerHTML = "";
    c.articles.forEach(function (a) {
      var el = document.createElement("div");
      el.className = "article";
      el.innerHTML = "<div class=\"art-num\">" + a.num + "</div><h3>" + a.title + "</h3><p>" + a.text + "</p>";
      artWrap.appendChild(el);
    });

    var secWrap = document.querySelector("[data-sections]");
    secWrap.innerHTML = "";
    c.sections.forEach(function (s) {
      var el = document.createElement("div");
      el.className = "section-row";
      el.innerHTML = "<div class=\"range\">" + s.range + "</div><div class=\"body\"><h3>" + s.title + "</h3><p>" + s.text + "</p></div>";
      secWrap.appendChild(el);
    });
  }

  var LANG_STORAGE_KEY = "wahlblickLang";

  document.querySelectorAll(".lang-switch button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var lang = btn.getAttribute("data-lang");
      localStorage.setItem(LANG_STORAGE_KEY, lang);
      document.querySelectorAll(".lang-switch button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      render(lang);
    });
  });

  var initialLang = localStorage.getItem(LANG_STORAGE_KEY) || "de";
  if (!CONTENT[initialLang]) initialLang = "de";
  document.querySelectorAll(".lang-switch button").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-lang") === initialLang);
  });
  render(initialLang);
</script>
